name: Browser smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cybertruck-smoke-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
      - name: Desktop and mobile smoke tests
        run: npx playwright test tests/browser-smoke.spec.cjs --reporter=line --workers=1
      - name: Upload smoke-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-results
          path: test-results/
          if-no-files-found: ignore
